name: Sync publications

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 1 1,4,7,10 *'

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch ORCID and Crossref metadata
        run: node scripts/sync-publications.mjs
      - name: Commit changed publication data
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No publication changes found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publications from ORCID and Crossref"
          git push
